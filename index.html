<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Pokopia 工具箱｜寶可夢・棲地・道具・料理查詢</title>
<style>
:root{--bg:#f6f2e7;--panel:#fffdf7;--ink:#2f3a2f;--mute:#6f7a6a;--line:#e3dccb;--green:#3d8b57;--green-d:#2c6a41;--green-l:#e3f1e5;--sand:#efe6cf;--accent:#e58f3a;--sea:#3a86c8;--event:#d7742f;--red:#c84b3c;--r:14px;--shadow:0 1px 2px rgba(60,50,20,.08),0 4px 14px rgba(60,50,20,.06)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;font-size:15px;line-height:1.55}
a{color:var(--green-d);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#4a9a63,#3d8b57);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.hwrap{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:#fff;white-space:nowrap}.logo small{font-weight:500;opacity:.85;font-size:12px;margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}nav a{color:#eaf6ec;padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
nav a:hover{background:rgba(255,255,255,.15);text-decoration:none}nav a.on{background:#fff;color:var(--green-d)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:24px;margin:4px 0 14px}h2{font-size:18px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--green)}h3{font-size:15px;margin:14px 0 8px;color:var(--green-d)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar input[type=search],.bar select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
.bar input[type=search]{flex:1 1 220px}.bar label,.ck{font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.ck{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink)}
.count{color:var(--mute);font-size:13px;margin:-6px 0 10px}
.grid{display:grid;gap:10px}.g-pk{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}.g-hab{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.g-it{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;color:var(--ink);transition:transform .1s,box-shadow .1s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);text-decoration:none}
.card .no{font-size:11px;color:var(--mute)}.card .nm{font-weight:700;font-size:14px;line-height:1.3}
.card img.pk{width:72px;height:72px;object-fit:contain}.card img.it{width:52px;height:52px;object-fit:contain}
.card img.hab{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--sand)}
.card .sub{font-size:12px;color:var(--mute)}
.flag{position:absolute;top:6px;right:6px;font-size:10px;padding:1px 6px;border-radius:999px;color:#fff;font-weight:700}.flag.s{background:var(--sea)}.flag.e{background:var(--event)}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.chips.l{justify-content:flex-start}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--green-l);color:var(--green-d);border:1px solid #cfe5d3;white-space:nowrap;font-weight:600}
a.chip:hover{text-decoration:none;background:#d2eada}
.chip.hit{background:#fff1dc;border-color:#f3cf9c;color:#9a5410}.chip.gray{background:#f1eee6;border-color:var(--line);color:var(--mute)}
.chip.no{background:#fde8e5;border-color:#f2c1ba;color:#a2382b}.chip.env{background:#e6f0fb;border-color:#c3d7ee;color:#2b5d8f}.chip.flv{background:#fbe9f3;border-color:#efc5dc;color:#8d2f63}
.chip img{width:16px;height:16px}
.type{display:inline-block;padding:1px 8px;border-radius:6px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.detail{display:grid;grid-template-columns:260px 1fr;gap:18px}@media(max-width:760px){.detail{grid-template-columns:1fr}}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero img.big{width:220px;height:220px;object-fit:contain;background:radial-gradient(circle,#fff 0,#f2ecda 70%);border-radius:50%}
.hero img.bighab{width:100%;border-radius:12px}.hero img.bigit{width:160px;height:160px;object-fit:contain;background:radial-gradient(circle,#fff 0,#f2ecda 70%);border-radius:24px;padding:10px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}dl.kv dt{color:var(--mute);font-size:13px;white-space:nowrap}dl.kv dd{margin:0}
table{border-collapse:collapse;width:100%;background:var(--panel)}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:middle;font-size:14px}
th{background:var(--sand);font-size:13px;color:#5b5440}tr:hover td{background:#fbf8ef}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mini{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;white-space:nowrap}.mini img{width:32px;height:32px;object-fit:contain}.mini.sm img{width:24px;height:24px}
.ico{width:22px;height:22px;vertical-align:middle;object-fit:contain}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.muted{color:var(--mute)}.small{font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button,.btn{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.slots{grid-template-columns:repeat(2,1fr)}}
.slot{border:2px dashed var(--line);border-radius:12px;min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fffef9;position:relative;padding:8px;text-align:center}
.slot.full{border-style:solid;border-color:#bcd9c3;background:var(--panel)}
.slot .x{position:absolute;top:4px;right:6px;border:0;background:#eee;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;color:#555}
.slot img{width:64px;height:64px;object-fit:contain}
.picker{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fffef9}
.pick{display:inline-flex;flex-direction:column;align-items:center;width:88px;padding:4px;border-radius:10px;cursor:pointer;font-size:12px;border:1px solid transparent;vertical-align:top;position:relative}
.pick:hover{background:var(--green-l);border-color:#cfe5d3}.pick.sel{background:#fff1dc;border-color:#f3cf9c}.pick img{width:48px;height:48px;object-fit:contain}
.pick .rs{position:absolute;top:2px;left:2px;background:var(--accent);color:#fff;border-radius:8px;font-size:10px;font-weight:800;padding:0 5px}
.score{display:inline-block;min-width:40px;text-align:center;font-weight:800;color:#fff;background:var(--accent);border-radius:8px;padding:1px 6px;font-size:13px}.score.full{background:var(--red)}
.mres{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.mitem{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.mitem img.it{width:44px;height:44px;object-fit:contain;flex:none}.mitem .nm{font-weight:700}
details{margin:8px 0}details summary{cursor:pointer;font-weight:700;color:var(--green-d);padding:4px 0}
.note{background:#fff8e6;border:1px solid #f1dfb2;border-radius:10px;padding:8px 12px;font-size:13px;color:#6b5a2a}
.warn{background:#fdecea;border:1px solid #f2c1ba;border-radius:10px;padding:8px 12px;font-size:13px;color:#8a2d22}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.home-card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);color:var(--ink)}
.home-card:hover{text-decoration:none;transform:translateY(-2px)}.home-card b{font-size:17px;color:var(--green-d)}.home-card p{margin:6px 0 0;color:var(--mute);font-size:13px}
footer{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--mute);font-size:12px}
.tm{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;margin:1px;background:#eee;color:#aaa}.tm.t.on{background:#fde3c4;color:#8a4a08;font-weight:700}.tm.w.on{background:#d6ecfd;color:#1f5d93;font-weight:700}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}.spcard{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--ink)}.spcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);text-decoration:none}
.slot .chip img.ico,.slot .chip img{width:18px!important;height:18px!important;margin:0 2px 0 0}
.slot .spmini{gap:3px}.slot .spmini .chip{font-size:12px;padding:2px 9px;gap:4px;border-width:1px}.slot .spmini .chip img.ico,.slot .spmini .chip img{width:18px!important;height:18px!important;margin:0}
.pn{display:inline-block;line-height:1.15;vertical-align:middle;text-align:inherit}.pf{display:block;font-size:.66em;font-weight:inherit;line-height:1.3}
.btn.tog.on{background:var(--green);color:#fff;border-color:var(--green)}
.psp{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:2px}.psp span{font-size:11px;color:#55705f;background:#eef5ef;border-radius:6px;padding:0 5px;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}.psp span.hit{background:#cfe9d6;color:#1f5d33;font-weight:700}.psp img.ico{width:14px;height:14px}
.towns{display:inline-flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px}.tw2{font-size:11px;padding:0 5px;border-radius:5px;background:#eee;color:#aaa}.tw2.on{background:#e5dcf7;color:#4b3a85;font-weight:700}.lim{color:#b0531c}
.frow{display:flex;gap:8px;align-items:flex-start}.frow>.flab{flex:none;width:3em;font-size:13px;font-weight:700;color:var(--muted,#7a7a6a);padding-top:6px;text-align:right}.frow>div{flex:1;min-width:0}.tabs.sub{margin-top:0}.tabs button:disabled{opacity:.4;cursor:not-allowed;background:#f3f1ea}.tabs.sub button{font-size:12px;padding:3px 10px}
.vt{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.vt button{border:0;background:#fff;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}.vt button.on{background:var(--green);color:#fff}
th.sort{cursor:pointer;user-select:none;white-space:nowrap}th.sort:hover{background:#e6dbbd}th.sort .ar{color:#a08f62;font-size:11px;margin-left:3px}
.craft{display:inline-block;background:#f3eefc;border:1px solid #dacff3;color:#55408f;border-radius:8px;padding:1px 7px;font-size:12px;margin:2px 0}.craft b{color:#3d2a7a}
.lv{display:inline-block;min-width:44px;text-align:center;border-radius:6px;font-size:12px;font-weight:800;padding:1px 6px}
.lv1{background:#eef3e6;color:#57713a}.lv2{background:#fdeccb;color:#8a5a0c}.lv3{background:#f9d4cc;color:#9b2c1e}.lv0{background:#eee;color:#888}
.dsp{font-size:12px;color:var(--mute)}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tag = (src, cls, alt) => src ? `<img class="${cls}" loading="lazy" src="${src}" alt="${esc(alt)}">` : `<span class="${cls}" style="display:inline-block"></span>`;
const pImg = (p,size,cls='pk') => tag(IMG.p[p.id], cls, p.n);
const iImg = (it,size,cls='it') => tag(IMG.i[it.id], cls, it.n);
const hImg = (h,size,cls='hab') => tag(IMG.h[h.slug], cls, h.n);
const TC = {'一般':'#9fa19f','格鬥':'#e49021','飛行':'#81b9ef','毒':'#9141cb','地面':'#915121','岩石':'#afa981','蟲':'#91a119','幽靈':'#704170','鋼':'#60a1b8','火':'#e62829','水':'#2980ef','草':'#3fa129','電':'#e0c000','超能力':'#ef4179','冰':'#3dcef3','龍':'#5060e1','惡':'#624d4e','妖精':'#ef70ef'};
const typeTag = t => `<span class="type" style="background:${TC[TN[t]]}">${TN[t]}</span>`;
const SEC = {main:'', event:'活動', sea:'海底'}, SECN = {main:'本篇', event:'活動', sea:'海底（擴充）'};
const pNo = p => (SEC[p.s]?SEC[p.s]+' ':'')+'#'+String(p.no).padStart(3,'0');
const pNm = p => p.f ? `<span class="pn">${esc(p.b)}<span class="pf">（${esc(p.f)}）</span></span>` : esc(p.n);
const pNmI = p => p.f ? `${esc(p.b)}（${esc(p.f)}）` : esc(p.n);
const pLink = (i,txt) => `<a href="#/pokemon/${i}">${txt ?? pNm(P[i])}</a>`;
const iLink = (i,txt) => `<a href="#/item/${i}">${txt ?? esc(I[i].n)}</a>`;
const hLink = (i,txt) => `<a href="#/habitat/${i}">${txt ?? esc(H[i].n)}</a>`;
const favChip = (f,cls='') => `<a class="chip ${cls}" href="#/fav/${f}">${esc(FAV[f])}</a>`;
const envChip = (e,cls='env') => e?`<a class="chip ${cls}" href="#/env/${encodeURIComponent(e)}">${esc(e)}</a>`:'';
const flvChip = (f,cls='flv') => f?`<a class="chip ${cls}" href="#/flv/${encodeURIComponent(f)}">${esc(f)}</a>`:'';
const spIco = s => IMG.s[SPEN[s]] ? `<img class="ico" src="${IMG.s[SPEN[s]]}" alt="">` : '';
const TWS = ['荒野','海邊','山地','空島','空空鎮','雲島','海底'];
const ALLM = h => h.s==='main' ? '1111110' : '1111111';
const isAll = (m,h) => [...ALLM(h)].every((c,k)=>c!=='1'||m[k]==='1');
const townRow = (m) => `<span class="towns">${TOWNS.map((n,k)=>k===6&&m[6]!=='1'?'':`<span class="tw2 ${m[k]==='1'?'on':''}" title="${esc(n)}">${TWS[k]}</span>`).join('')}</span>`;
const townTxt = (m,h) => isAll(m,h) ? '<span class="muted small">全部城鎮</span>' : `<span class="small"><b class="lim">僅在</b> ${TOWNS.filter((n,k)=>m[k]==='1').map(esc).join('、')}</span>`;
const pkMask = (hi,pi) => (H[hi].pk.find(x=>x[0]===pi)||[])[4] || ALLM(H[hi]);
const ITAG = ['休憩','桌子','裝飾','玩具','道路','地毯','_'];
// 棲地需求類別 → 遊戲標籤（依名稱與成員道具的標籤推定）
const GTAG = {'桌子（全部）':'桌子','桌子（大型）':'桌子','椅子（全部）':'休憩','椅子（長型）':'休憩','床鋪（全部）':'休憩','玩偶（全部）':'玩具','玩具（全部）':'玩具','音符墊（全部）':'玩具','牌子（全部）':'裝飾','路燈（全部）':'裝飾','畫布':'裝飾'};
const hTags = h => { const s=new Set(); h.rq.forEach(([n,c,ii])=>{ if(ii>=0){ if(I[ii].t) s.add(I[ii].t); } else if(GTAG[n]) s.add(GTAG[n]); }); return s; };
const hCats = h => new Set(h.rq.filter(r=>r[2]>=0).map(r=>I[r[2]].k));
const SPIX = {}; SPI.forEach((x,k)=>SPIX[x.n]=k);
const SPP = {}; P.forEach((p,i)=>p.sp.forEach(s=>(SPP[s] ||= []).push(i)));
const spChip = s => `<a class="chip" href="#/sp/${SPIX[s]??''}" title="看「${esc(s)}」專長介紹">${spIco(s)}${esc(s)}</a>`;
const spIcoBig = s => IMG.s[SPEN[s]] ? `<img src="${IMG.s[SPEN[s]]}" alt="" style="width:40px;height:40px;object-fit:contain;flex:none">` : '<span style="width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#999;flex:none">？</span>';
const TM = ['黎明','白天','黃昏','夜晚'], WT = ['晴天','陰天','雨天'];
const ICAT = ['材料','食物','家具','雜貨','實用','戶外','大自然','建築','方塊','套組','化石','小遺失物','大遺失物','重要的物品','其他'];
const LVN = ['未確認','稍微','比較','相當'];
const craftTxt = it => it.cr ? `<span class="craft">🛠 材料單：${it.cr.m.map(([n,q,ii])=>(ii>=0?iLink(ii,esc(n)):esc(n))+'×'+q).join('、')} → 產出 <b>${it.cr.q||1}</b> 個${it.cr.e?'<span class="muted" title="來源未載明製作數量，依同類道具推定">（推定）</span>':''}</span>` : '';
const obtainList = it => { const o = (it.o||[]).filter(x=>!/^材料單製作$/.test(x)); return o; };
const priceNum = it => +((it.p||'').split('／')[0]) || -1;
const lvTag = l => `<span class="lv lv${l}">${LVN[l]}</span>`;
const rarCls = r => r==='非常稀有'?'no':(r==='稀有'?'hit':'gray');

// ---------- indexes
const IBYN = {}; I.forEach((it,i)=>{ if(!(it.n in IBYN)) IBYN[it.n]=i; });
const FAVP = FAV.map(()=>[]), FAVI = FAV.map(()=>[]);
P.forEach((p,i)=>p.fv.forEach(f=>FAVP[f].push(i)));
I.forEach((it,i)=>it.fv.forEach(f=>FAVI[f].push(i)));
const DISP = FAV.map(()=>[]); P.forEach((p,i)=>(p.dis||[]).forEach(f=>DISP[f].push(i)));
const ENVP = {}, ENVI = {}; ENVS.forEach(e=>{ENVP[e]=[];ENVI[e]=[];}); P.forEach((p,i)=>{ if(p.env) (ENVP[p.env] ||= []).push(i); }); I.forEach((it,i)=>(it.env||[]).forEach(e=>(ENVI[e] ||= []).push(i)));
const FLVP = {}, FLVI = {}; FLVS.forEach(f=>{FLVP[f]=[];FLVI[f]=[];}); P.forEach((p,i)=>{ if(p.flv) (FLVP[p.flv] ||= []).push(i); }); I.forEach((it,i)=>{ if(it.flv) (FLVI[it.flv] ||= []).push(i); });
const SPLIST = [...new Set(P.flatMap(p=>p.sp))];
const favSort = FAV.map((f,i)=>i).filter(i=>!FLVS.includes(FAV[i])).sort((a,b)=>FAV[a].localeCompare(FAV[b],'zh-Hant'));
// unified food offering list
const FOODS = [];
I.forEach((it,i)=>{ if(it.k!=='食物') return; const r = it.rec!=null ? R[it.rec] : null;
  const off = r ? r.off : (it.flv ? FLVOFF[it.flv] : ''); const lv = r ? r.lv : (it.ml||0);
  if(off) FOODS.push({i, off, lv, fl: it.flv || (r&&r.fl) || '', rec: it.rec}); });

function parseHash(){ const h = location.hash.replace(/^#\/?/,''); const [path, qs] = h.split('?'); const parts = path.split('/').filter(Boolean).map(decodeURIComponent); return {v:parts[0]||'', id:parts[1], q:Object.fromEntries(new URLSearchParams(qs||''))}; }
function setQ(q){ const {v,id} = parseHash(); const qs = new URLSearchParams(Object.entries(q).filter(([k,v])=>v!==''&&v!=null&&v!==false)).toString(); history.replaceState(null,'','#/'+v+(id!=null?'/'+encodeURIComponent(id):'')+(qs?'?'+qs:'')); }
function opt(list, sel, all='全部'){ return `<option value="">${all}</option>`+list.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(t)}</option>`}).join(''); }
const secOpt = q => opt([['main','本篇'],['event','活動'],['sea','海底（擴充）']], q, '全部圖鑑');

// ================= POKEMON LIST
function vPokemonList(q){
  $app.innerHTML = `<h1>寶可夢查詢</h1><div class="bar">
    <input type="search" id="s" placeholder="輸入名稱或編號…" value="${esc(q.s||'')}">
    <select id="t">${opt(TN.slice(1).map((t,i)=>[i+1,t]), q.t, '全部屬性')}</select>
    <select id="sp">${opt(SPLIST, q.sp, '全部專長')}</select>
    <select id="env">${opt(ENVS, q.env, '全部理想環境')}</select>
    <select id="flv">${opt(DATA.flvs, q.flv, '全部口味')}</select>
    <select id="fv">${opt(favSort.map(i=>[i,FAV[i]]), q.fv, '全部喜歡的東西')}</select>
    <select id="sec">${secOpt(q.sec)}</select></div><div class="count" id="c"></div><div class="grid g-pk" id="g"></div>`;
  const upd = () => {
    const f = {s:$('#s').value.trim(), t:$('#t').value, sp:$('#sp').value, env:$('#env').value, flv:$('#flv').value, fv:$('#fv').value, sec:$('#sec').value}; setQ(f);
    const res = P.map((p,i)=>i).filter(i=>{const p=P[i];
      if(f.s && !(p.n.includes(f.s) || String(p.no)===f.s.replace(/^0+/,'') || (p.nd && String(+p.nd)===f.s.replace(/^0+/,'')))) return false;
      if(f.t && !p.t.includes(+f.t)) return false; if(f.sp && !p.sp.includes(f.sp)) return false;
      if(f.env && p.env!==f.env) return false; if(f.flv && p.flv!==f.flv) return false;
      if(f.fv && !p.fv.includes(+f.fv)) return false; if(f.sec && p.s!==f.sec) return false; return true;});
    $('#c').textContent = `共 ${res.length} 隻`; $('#g').innerHTML = res.map(i=>pCard(i)).join('');
  };
  ['s','t','sp','env','flv','fv','sec'].forEach(id=>$('#'+id).addEventListener('input',upd)); upd();
}
function pCard(i, extra=''){ const p = P[i];
  return `<a class="card" href="#/pokemon/${i}">${p.s!=='main'?`<span class="flag ${p.s==='sea'?'s':'e'}">${SEC[p.s]}</span>`:''}${pImg(p,80)}<div class="no">${pNo(p)}</div><div class="nm">${pNm(p)}</div><div class="chips">${p.t.map(typeTag).join('')}</div>${extra}</a>`; }

// ================= POKEMON DETAIL
let OVOPT = {env:false, flv:false};
function overlapList(i, opt){
  const p = P[i], mine = new Set(p.fv);
  return P.map((q,j)=>{ const c = q.fv.filter(f=>mine.has(f)); const e = opt.env && p.env && q.env===p.env; const fl = opt.flv && p.flv && q.flv===p.flv;
      return {j, c, e, fl, n: c.length + (e?1:0) + (fl?1:0)}; })
    .filter(o=>o.j!==i && o.n>0)
    .sort((a,b)=>b.n-a.n || (P[b.j].env===p.env)-(P[a.j].env===p.env) || (P[b.j].flv===p.flv)-(P[a.j].flv===p.flv) || a.j-b.j);
}
function vPokemon(i){
  i=+i; const p = P[i]; if(!p) return vNotFound();
  const habs = p.h.map(([hi,r,tm,wt])=>{const lm=pkMask(hi,i); return `<a class="card" href="#/habitat/${hi}">${hImg(H[hi])}<div class="nm">${esc(H[hi].n)}</div><div class="chips">${r?`<span class="chip ${rarCls(r)}">${esc(r)}</span>`:''}</div><div class="small">${TM.map((t,k)=>`<span class="tm t ${tm[k]==='1'?'on':''}">${t}</span>`).join('')}<br>${WT.map((t,k)=>`<span class="tm w ${wt[k]==='1'?'on':''}">${t}</span>`).join('')}</div><div class="small" style="margin-top:3px">${townTxt(lm,H[hi])}</div></a>`}).join('');
  const flvFoods = (FLVI[p.flv]||[]).map(n=>iLink(n,`<span class="mini sm">${iImg(I[n],32,'')}${esc(I[n].n)}</span>`)).join('');
  const envItems = (ENVI[p.env]||[]).map(n=>iLink(n,`<span class="mini sm">${iImg(I[n],32,'')}${esc(I[n].n)}</span>`)).join('');
  $app.innerHTML = `
  <div class="row small muted" style="margin-bottom:8px">${i>0?pLink(i-1,'← '+pNmI(P[i-1])):''}<span style="flex:1"></span>${i<P.length-1?pLink(i+1,pNmI(P[i+1])+' →'):''}</div>
  <div class="detail"><div class="panel hero">${pImg(p,null,'big')}<div class="muted">${pNo(p)}${p.nd?`　全國 #${p.nd}`:''}</div><h1 style="margin:0">${pNm(p)}</h1>
    <div class="chips">${p.t.map(typeTag).join(' ')}</div><a class="btn pri" href="#/match?p=${i}&rec=1">推薦喜好相近的室友 →</a></div>
  <div class="panel"><dl class="kv">
    <dt>圖鑑</dt><dd>${SECN[p.s]}${p.loc?`　<span class="muted small">主要地點：${esc(p.loc)}</span>`:''}</dd>
    <dt>專長</dt><dd><div class="chips l">${p.sp.map(spChip).join('')}</div></dd>
    <dt>理想環境</dt><dd>${envChip(p.env)||'—'}</dd>
    <dt>喜歡的口味</dt><dd>${flvChip(p.flv)||'—'}</dd>
    <dt>喜歡的東西</dt><dd><div class="chips l">${p.fv.map(f=>favChip(f)).join('')||'—'}</div></dd>
    ${p.dis&&p.dis.length?`<dt>討厭的東西</dt><dd><div class="chips l">${p.dis.map(f=>favChip(f,'no')).join('')}</div><div class="small muted">來源：Notion 社群資料庫（Disliked by）</div></dd>`:''}
    <dt>出現時間</dt><dd>${TM.map((t,k)=>`<span class="tm t ${p.tm[k]==='1'?'on':''}">${t}</span>`).join('')}</dd>
    <dt>出現天氣</dt><dd>${WT.map((t,k)=>`<span class="tm w ${p.wt[k]==='1'?'on':''}">${t}</span>`).join('')}</dd>
  </dl>
  ${p.env?`<details><summary>能營造「${esc(p.env)}」環境的道具</summary><div>${envItems||'<span class="muted small">沒有對應道具（加蓋屋頂、遠離光源等方式營造）</span>'}</div></details>`:''}
  ${p.flv?`<details open><summary>「${esc(p.flv)}」口味的食物</summary><div>${flvFoods}</div></details>`:''}
  </div></div>
  <h2>出現的棲地</h2>${habs?`<div class="grid g-hab">${habs}</div>`:`<p class="muted">不從棲地出現（劇情、傳說或特殊事件登場）。</p>`}
  <h2>喜歡的東西重疊的寶可夢（由多到少）</h2>
  <div class="bar"><label class="ck"><input type="checkbox" id="oenv" ${OVOPT.env?'checked':''}> 理想環境納入重疊數</label><label class="ck"><input type="checkbox" id="oflv" ${OVOPT.flv?'checked':''}> 口味納入重疊數</label></div>
  <div id="ov"></div>`;
  const draw = () => {
    const ov = overlapList(i, OVOPT); const groups = {}; ov.forEach(o=>(groups[o.n] ||= []).push(o));
    $('#ov').innerHTML = Object.keys(groups).sort((a,b)=>b-a).map(k=>{
      const rows = groups[k].map(o=>{const q=P[o.j]; return `<tr><td>${pLink(o.j, `<span class="mini">${pImg(q,40,'')}${esc(q.n)}</span>`)}</td><td><div class="chips l">${o.c.map(f=>favChip(f,'hit')).join('')}${o.e?envChip(q.env):''}${o.fl?flvChip(q.flv):''}</div></td><td>${q.env===p.env?envChip(q.env):`<span class="muted small">${esc(q.env)}</span>`}</td><td>${q.flv===p.flv?flvChip(q.flv):`<span class="muted small">${esc(q.flv)}</span>`}</td><td><a class="btn" href="#/match?p=${i},${o.j}">配對道具</a></td></tr>`}).join('');
      return `<details ${k>=3?'open':''}><summary>重疊 ${k} 項（${groups[k].length} 隻）</summary><div class="tw"><table><tr><th>寶可夢</th><th>重疊項目</th><th>理想環境</th><th>口味</th><th></th></tr>${rows}</table></div></details>`;
    }).join('') || '<p class="muted">沒有資料</p>';
  };
  $('#oenv').addEventListener('input',e=>{OVOPT.env=e.target.checked;draw();}); $('#oflv').addEventListener('input',e=>{OVOPT.flv=e.target.checked;draw();}); draw();
}

// ================= HABITAT
function vHabitatList(q){
  $app.innerHTML = `<h1>棲地查詢</h1><div class="bar"><input type="search" id="s" placeholder="棲地名稱、所需物品或寶可夢…" value="${esc(q.s||'')}"><select id="sec">${secOpt(q.sec)}</select><select id="town">${opt(TOWNS.map((n,k)=>[k,n]), q.town, '全部地圖')}</select>
  <select id="rtag"><option value="">全部材料標籤</option><optgroup label="材料的道具標籤">${ITAG.filter(x=>x!=='_').map(x=>`<option value="t:${x}" ${q.rtag==='t:'+x?'selected':''}>${x}</option>`).join('')}</optgroup><optgroup label="材料的道具分類">${ICAT.filter(c=>H.some(h=>hCats(h).has(c))).map(c=>`<option value="k:${c}" ${q.rtag==='k:'+c?'selected':''}>${c}</option>`).join('')}</optgroup><optgroup label="需求類別（任一符合即可）">${[...new Set(H.flatMap(h=>h.rq.filter(r=>r[2]<0).map(r=>r[0])))].sort((a,b)=>a.localeCompare(b,'zh-Hant')).map(g=>`<option value="g:${esc(g)}" ${q.rtag==='g:'+g?'selected':''}>${esc(g)}</option>`).join('')}</optgroup></select></div>
  <div class="bar" style="margin-top:-4px"><label class="ck"><input type="checkbox" id="limo" ${q.lim?'checked':''}> 只顯示有「限定地圖寶可夢」的棲地</label></div>
  <p class="muted small" style="margin:4px 0 10px">大部分寶可夢在所有城鎮都會出現；標示「部分寶可夢限定地圖」的棲地，有寶可夢只在特定城鎮（多半含雲島）出現。資料以 52poke 為主、Serebii 補充。</p>
  <div class="count" id="c"></div><div class="grid g-hab" id="g"></div>`;

function renderMatch(){

  const sel=MSEL.map(i=>P[i]);

  const keyChip = (k,cls) => k[0]==='f' ? favChip(+k.slice(1),cls) : k[0]==='e' ? envChip(k.slice(1), cls||'env') : flvChip(k.slice(1), cls||'flv');

  const scored=[];

    sets.forEach((ps,k)=>{let c=0; ks.forEach(x=>{if(ps.has(x)){c++;cats.add(x);}}); if(c){who.push(k); hits+=c;} (sel[k].dis||[]).forEach(f=>{ if(it.fv.includes(f)) dis.push([k,f]); }); });
    if(who.length>=2) scored.push({i,who,hits,cats:[...cats],dis}); });
  scored.sort((a,b)=>b.who.length-a.who.length||b.hits-a.hits||a.dis.length-b.dis.length||a.i-b.i);
  const MCAT = ICAT.filter(k=>k!=='材料'); MCAT.splice(MCAT.length-1,0,'材料');
  const cats = MCAT.filter(k=>scored.some(s=>I[s.i].k===k));

  <h2>符合的道具（${scored.length} 件）</h2>
  <div class="bar"><select id="mmin">${[...Array(n-1).keys()].map(k=>k+2).map(v=>`<option value="${v}" ${MOPT.min==v?'selected':''}>${v===n?`全員都喜歡（${n}/${n}）`:`至少 ${v} 隻喜歡`}</option>`).join('')}</select>

  <div id="mlist"></div>`;
  const draw=()=>{ const min=Math.max(2,Math.min(+MOPT.min,n)); const nodis=$('#mnodis').checked;
    const list=scored.filter(s=>s.who.length>=min && (!MOPT.k||I[s.i].k===MOPT.k) && (!MOPT.s||I[s.i].n.includes(MOPT.s)) && (!nodis||!s.dis.length));
    const by={}; list.forEach(s=>(by[I[s.i].k] ||= []).push(s));
    $('#mlist').innerHTML = MCAT.filter(k=>by[k]).map(k=>`<h3>${k}（${by[k].length}）</h3><div class="mres">${by[k].map(s=>{const it=I[s.i]; const ks=itemKeys(it);
      return `<div class="mitem">${iLink(s.i, iImg(it,48))}<div style="flex:1;min-width:0"><div class="row"><span class="score ${s.who.length===n?'full':''}">${s.who.length}/${n}</span>${iLink(s.i,`<span class="nm">${esc(it.n)}</span>`)}${it.t?`<span class="small muted">${esc(it.t)}</span>`:''}</div>
      <div class="chips l" style="margin-top:4px">${[...ks].map(x=>`<span class="chip ${s.cats.includes(x)?'hit':'gray'}">${esc(keyName(x))}</span>`).join('')}</div>
      <div class="small muted" style="margin-top:3px">${s.who.map(k=>esc(sel[k].n)).join('、')} 喜歡</div>${s.dis.length?`<div class="small" style="color:var(--red)">${s.dis.map(([k,f])=>`${esc(sel[k].n)} 討厭「${esc(FAV[f])}」`).join('；')}</div>`:''}</div></div>`}).join('')}</div>`).join('') || '<p class="muted">沒有符合條件的道具</p>'; };
  $('#mmin').addEventListener('input',e=>{MOPT.min=+e.target.value; draw();});
  $('#mfs').addEventListener('input',e=>{MOPT.s=e.target.value.trim(); draw();});
  $('#mnodis').addEventListener('input',draw);
  $('#mtabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; MOPT.k=b.dataset.k; [...$('#mtabs').children].forEach(x=>x.classList.toggle('on',x===b)); draw();});
  draw();
}

// ================= EVAL
function vEval(){
  const dItems = I.map((it,i)=>i).filter(i=>(I[i].dsp||[]).some(x=>!x[3]));
  const notItems = I.map((it,i)=>i).filter(i=>(I[i].no||[]).length);
  const cf = t => CONF.filter(c=>c.type===t);
  const srcRow = (n,name,url,use,grade) => `<tr><td>${n}</td><td><b>${esc(name)}</b><br><span class="small muted">${esc(url)}</span></td><td class="small">${use}</td><td class="small">${grade}</td></tr>`;
  $app.innerHTML = `<h1>資料來源與評估</h1>

  ${srcRow(2,'Serebii','serebii.net/pokemonpokopia','52poke 缺資料時的寶可夢喜好、理想環境、棲地稀有度／時間／天氣；喜好類別道具清單；寶可夢圖片（250px，含淺淺丘、苔卡比獸等不同形態）','資料細緻，與 52poke 高度一致，列為第二順位。')}
  ${srcRow(3,'Bulbapedia','bulbapedia.bulbagarden.net（List of recipes / event / Basin recipes）','材料單的原料與製作產出數量（52poke 道具頁未載明時採用）、52poke 未標記的可製作道具','與 52poke 已載明的製作數量逐一比對完全一致，列為第三順位。')}
  ${srcRow(4,'Pokopia 攻略 Wiki（gamertw）','pokopia.gamertw.com/zh-TW','道具與棲地清單骨架、食譜結構、苔卡比獸效果強度、道具（160px）與棲地（300px）圖片；中文譯名後備','資料完整但部分道具喜好清單不完整、棲地稀有度／天氣與實際遊戲常不一致。')}
  ${srcRow(5,'PokopiaDex','pokopiadex.com','道具標籤（裝飾／休憩／玩具）後備、道具喜好類別後備、DLC 標記','結構化程度高；僅在前述來源都沒有資料時採用。')}
  ${srcRow('反面','Notion 社群資料庫','thundering-council.notion.site','道具「Is NOT（經驗證不屬於）」、寶可夢「Disliked by（討厭）」','社群實測資料，僅涵蓋約 420 件道具；作為反面資訊與後備排除依據。')}
  ${srcRow('移除','Pokopia Wiki','pokopiawiki.com','不採用','依實際遊戲比對結果移除。')}
  ${srcRow('移除','Pokopia Island','pokopiaisland.com','不採用','頁面標示「Community Draft (Unverified)」，內容多為泛用描述，無可比對資料。')}
  </table></div>
  <h2>整合規則</h2>
  <div class="panel small">
  <ul>
    <li><b>優先順位</b>：52poke ＞ Serebii ＞ Bulbapedia ＞ 其他網站（gamertw、PokopiaDex）。</li>
    <li><b>道具標籤</b>：遊戲內的道具標籤只有「休憩、桌子、裝飾、玩具、道路、地毯」6 種（52poke、Bulbapedia 一致），在道具查詢中以分類下的第二層分頁呈現。棲地的「需求類別」（如椅子（全部））不是道具標籤；篩選時依名稱與成員道具推定對應標籤：桌子→桌子；椅子、床鋪→休憩；玩偶、玩具、音符墊→玩具；牌子、路燈、畫布→裝飾。</li>
    <li><b>棲地出現地圖</b>：每個棲地中寶可夢會出現的城鎮。以 52poke「棲息地列表」的「僅在…」限制為主；52poke 沒有限制時，採用 Serebii 各棲地頁面的 Location 清單。兩者不一致 11 筆（52poke 限定特定城鎮、Serebii 標示全部城鎮），依優先順位採用 52poke。</li>
    <li><b>專長說明</b>：以 52poke「專長（Pokopia）」的簡要與詳細說明為主，Serebii、Bulbapedia 的補充資訊另列「補充」；亂撒掉落物與收藏家交換物品取自 52poke 對應頁面。原本「發電／發光」英文對應錯誤（Generate／Illuminate），已修正；無專長的寶可夢依 52poke 標示為「？？？」。</li>
    <li><b>材料單</b>：原料以 52poke 材料單為主，缺漏時用 Bulbapedia，再用 gamertw；產出數量以 52poke 道具頁為主，其餘取自 Bulbapedia。每個欄位採用最高順位且有資料的來源。</li>
    <li><b>寶可夢的喜歡的東西（含口味）、理想環境、專長、棲地與稀有度／時間／天氣</b>：依上述順位取用；其他來源不同時記錄於下方分歧列表。</li>
    <li><b>道具的喜歡類別</b>：52poke 有收錄的道具採用 52poke；否則採用 Serebii；兩者都沒有時，需其他來源中至少 2 個支持（或只有 1 個來源收錄時採用該來源），並以 Notion「不屬於」排除。</li>
    <li><b>中文名稱與說明</b>：以 52poke 為主；52poke 沒有時改用 gamertw。</li>
  </ul></div>
  <h2>統計</h2>
  <div class="panel"><dl class="kv">
    <dt>喜好清單有分歧的寶可夢</dt><dd>${cf('fav').length} 隻</dd>
    <dt>理想環境有分歧的寶可夢</dt><dd>${cf('env').length} 隻</dd>
    <dt>棲地稀有度／天氣有分歧</dt><dd>${cf('hab').length} 筆</dd>
    <dt>有類別被排除的道具</dt><dd>${dItems.length} 件</dd>
    <dt>Notion「不屬於」標記</dt><dd>${notItems.length} 件道具</dd>
    <dt>Notion「討厭」標記</dt><dd>${P.filter(p=>(p.dis||[]).length).length} 隻寶可夢</dd>
  </dl></div>
  <h2>反面資訊：討厭的東西（Disliked by）</h2>
  <div class="tw"><table><tr><th>類別</th><th>討厭的寶可夢</th><th>同時列為喜歡的道具數</th></tr>${FAV.map((f,k)=>k).filter(k=>DISP[k].length).map(k=>`<tr><td>${favChip(k,'no')}</td><td>${DISP[k].map(j=>pLink(j,`<span class="mini sm">${pImg(P[j],32,'')}${pNm(P[j])}</span>`)).join('')}</td><td>${FAVI[k].length}</td></tr>`).join('')}</table></div>
  <h2>反面資訊：經驗證「不屬於」的道具（Is NOT）</h2>
  <details><summary>展開 ${notItems.length} 件</summary><div class="tw"><table><tr><th>道具</th><th>不屬於</th><th>目前採用的類別</th></tr>${notItems.map(i=>`<tr><td>${iLink(i,`<span class="mini sm">${iImg(I[i],32,'')}${esc(I[i].n)}</span>`)}</td><td>${I[i].no.map(f=>favChip(f,'no')).join(' ')}</td><td>${I[i].fv.map(f=>favChip(f)).join(' ')}</td></tr>`).join('')}</table></div></details>
  <h2>道具喜好類別：被排除的項目</h2>
  <details><summary>展開 ${dItems.length} 件</summary><div class="tw"><table><tr><th>道具</th><th>被排除的類別</th><th>支持</th><th>不支持</th></tr>${dItems.map(i=>I[i].dsp.filter(x=>!x[3]).map(([f,y,no])=>`<tr><td>${iLink(i,esc(I[i].n))}</td><td>${favChip(f,'no')}</td><td class="small">${y.map(esc).join('、')}</td><td class="small">${no.map(esc).join('、')}</td></tr>`).join('')).join('')}</table></div></details>
  <h2>寶可夢資料分歧</h2>
  <details><summary>喜好清單分歧（${cf('fav').length}）</summary><div class="tw"><table><tr><th>寶可夢</th><th>各來源</th></tr>${cf('fav').map(c=>`<tr><td>${esc(c.p)}</td><td class="small">${Object.entries(c.src).map(([s,v])=>`<b>${esc(SRC[s]||s)}</b>：${v.map(esc).join('、')}`).join('<br>')}</td></tr>`).join('')}</table></div></details>
  <details><summary>理想環境分歧（${cf('env').length}）</summary><div class="tw"><table><tr><th>寶可夢</th><th>各來源</th></tr>${cf('env').map(c=>`<tr><td>${esc(c.p)}</td><td class="small">${Object.entries(c.src).map(([s,v])=>`${esc(SRC[s]||s)}：${esc(v)}`).join('；')}</td></tr>`).join('')}</table></div></details>
  <details><summary>棲地稀有度／天氣分歧（${cf('hab').length}）</summary><div class="tw"><table><tr><th>寶可夢</th><th>棲地</th><th>稀有度</th><th>天氣</th></tr>${cf('hab').map(c=>`<tr><td>${esc(c.p)}</td><td>${esc(c.h)}</td><td class="small">${Object.entries(c.src).map(([s,v])=>`${esc(SRC[s]||s)}：${esc(v)}`).join('；')}</td><td class="small">${Object.entries(c.w||{}).map(([s,v])=>`${esc(SRC[s]||s)}：${v.map(x=>({Sunny:'晴',Cloudy:'陰',Rainy:'雨'}[x])).join('')}`).join('；')}</td></tr>`).join('')}</table></div></details>`;
}

function vNotFound(){ $app.innerHTML = '<h1>找不到頁面</h1><p><a href="#/">回首頁</a></p>'; }
let lastKey = null, lastV = null;
function route(){
  const {v,id,q} = parseHash();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===v || (v==='env'||v==='flv') && a.dataset.v==='fav'));
  const key = v+'/'+(id??'');
  lastKey = key;
  if(v==='pokemon') id!=null ? vPokemon(id) : vPokemonList(q);
  else if(v==='habitat') id!=null ? vHabitat(id) : vHabitatList(q);
  else if(v==='item') id!=null ? vItem(id) : vItemList(q);
  else if(v==='fav') id!=null ? vFav(id) : vFavList();
  else if(v==='sp') id!=null ? vSp(id) : vSpList();
  else if(v==='env') vEnv(id); else if(v==='flv') vFlv(id);
  else if(v==='food') vFood(q); else if(v==='match') vMatch(q); else if(v==='eval') vEval();
  else vHome();
  if(id!=null || v!==lastV) window.scrollTo(0,0); lastV = v;
}
window.addEventListener('hashchange', route); route();
</script>
